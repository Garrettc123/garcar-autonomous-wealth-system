name: "\U0001F916 Garcar Master Orchestrator"
# Fires:
#   - workflow_dispatch: manual with cycle_count param
#   - push: only on Python source files (not workflow files)

on:
  push:
    branches: [main]
    paths:
      - 'orchestrator_master.py'
      - 'performance_amplifier.py'
      - 'system_monitor.py'
      - 'revenue_compounding_loop.py'
      - 'customer_acquisition_loop.py'
      - 'secrets_provisioner.py'
  workflow_dispatch:
    inputs:
      cycle_count:
        description: 'Cycles to run (default 1)'
        required: false
        default: '1'
      dry_run:
        description: 'Dry run (no live emails/Stripe)'
        required: false
        default: 'false'

concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: false   # never cancel a running orchestrator cycle

permissions:
  id-token: write
  contents: write

jobs:
  orchestrate:
    name: "\U0001F916 All Systems"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check secrets
        env:
          AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$AWS_ACCOUNT" ] && [ -z "$AWS_KEY" ]; then
            echo "⚠️ Neither AWS_ACCOUNT_ID (OIDC) nor AWS_ACCESS_KEY_ID (static) configured — skipping"
            exit 0
          fi
          if [ -z "$STRIPE_KEY" ]; then
            echo "⚠️ STRIPE_SECRET_KEY not configured — skipping"
            exit 0
          fi
          if [ -z "$OPENAI_KEY" ]; then
            echo "⚠️ OPENAI_API_KEY not configured — skipping"
            exit 0
          fi

      - uses: actions/checkout@v4

      - name: AWS Auth (OIDC)
        id: oidc
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/garcar-github-actions-role
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: AWS Auth (fallback)
        if: steps.oidc.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          pip install -r requirements.txt -q
          pip install boto3 pynacl requests stripe openai twilio -q
          npm install 2>/dev/null || true

      - name: "\U0001F510 Sync secrets from SSM"
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AWS_REGION:        ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: python secrets_provisioner.py
        continue-on-error: true

      - name: "\U0001F916 Orchestrator cycles"
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          AWS_REGION:         ${{ secrets.AWS_REGION || 'us-east-1' }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY:  ${{ secrets.STRIPE_SECRET_KEY }}
          APOLLO_API_KEY:     ${{ secrets.APOLLO_API_KEY }}
          LINEAR_API_KEY:     ${{ secrets.LINEAR_API_KEY }}
          SES_SENDER_EMAIL:   ${{ secrets.SES_SENDER_EMAIL }}
          S3_BUCKET:          ${{ secrets.S3_BUCKET || 'garcar-revenue-data' }}
          DRY_RUN:            ${{ github.event.inputs.dry_run || 'false' }}
          CYCLE_COUNT:        ${{ github.event.inputs.cycle_count || '1' }}
        run: |
          for i in $(seq 1 "$CYCLE_COUNT"); do
            echo "=== Orchestrator Cycle $i of $CYCLE_COUNT ==="
            python orchestrator_master.py
          done

      - name: "\U0001F4B0 Revenue compounding"
        env:
          AWS_REGION:        ${{ secrets.AWS_REGION || 'us-east-1' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SES_SENDER_EMAIL:  ${{ secrets.SES_SENDER_EMAIL }}
          S3_BUCKET:         ${{ secrets.S3_BUCKET || 'garcar-revenue-data' }}
          UPGRADE_URL:       ${{ secrets.UPGRADE_URL || 'https://app.garcar.io/upgrade' }}
          CALENDAR_URL:      ${{ secrets.CALENDAR_URL || 'https://cal.garcar.io/enterprise' }}
        run: python revenue_compounding_loop.py
        continue-on-error: true

      - name: "\U0001F4C8 Performance amplifier"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          S3_BUCKET:  ${{ secrets.S3_BUCKET || 'garcar-revenue-data' }}
        run: python performance_amplifier.py
        continue-on-error: true

      - name: "\U0001FA7A System monitor"
        env:
          AWS_REGION:       ${{ secrets.AWS_REGION || 'us-east-1' }}
          SES_SENDER_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
        run: python system_monitor.py
        continue-on-error: true

      - name: "\U0001F4CA Summary"
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json, os
          print('\n' + '='*56)
          print('  GARCAR ORCHESTRATOR — CYCLE COMPLETE')
          print('='*56)
          try:
              with open('acquisition_ledger.json') as f: ledger = json.load(f)
              sent = [r for r in ledger[-50:] if r.get('email_status')=='sent']
              print(f'  Emails sent this cycle: {len(sent)}')
              print(f'  Total ledger entries:   {len(ledger)}')
          except: print('  Ledger: not yet available')
          try:
              with open('alw_ledger.json') as f: alw = json.load(f)
              total = sum(e.get('gross_revenue',0) for e in alw)
              print(f'  Gross revenue logged:   ${total:,.2f}')
          except: print('  ALW ledger: not yet available')
          repo = os.environ.get('REPO', '')
          print(f'  Monitor: https://github.com/{repo}/actions')
          print('='*56)
          PYEOF
