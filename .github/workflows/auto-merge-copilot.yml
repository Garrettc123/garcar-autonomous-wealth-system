name: Auto-Merge Copilot PRs

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  check_suite:
    types: [completed]
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Check secrets
        env:
          GH_TOKEN_VAL: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN_VAL" ]; then
            echo "⚠️ GITHUB_TOKEN not configured — skipping"
            exit 0
          fi

      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || (
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list
            sudo apt-get update -qq && sudo apt-get install -y gh
          )

      - name: Auto-merge ready PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          OPEN_PRS=$(gh pr list --repo "$REPO" --state open --json number,isDraft,mergeable 2>/dev/null || echo '[]')
          echo "Open PRs: $OPEN_PRS"
          echo "$OPEN_PRS" | jq -r '.[] | select(.isDraft == false and .mergeable == "MERGEABLE") | .number' | while read -r PR_NUM; do
            echo "Merging PR #$PR_NUM"
            gh pr merge "$PR_NUM" --repo "$REPO" --squash --auto --delete-branch 2>/dev/null || echo "PR #$PR_NUM not ready yet, skipping."
          done
