name: 🔑 Zero-Touch Secrets Provisioner

on:
  push:
    branches: [main]
    paths:
      - 'secrets_provisioner.py'
      - '.github/workflows/zero-touch-secrets.yml'
  workflow_dispatch:
    inputs:
      set_key:
        description: 'Optional: Set a single key (format: KEY_NAME=value)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: write

jobs:
  provision:
    name: Zero-Touch Provision All Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Check AWS secrets
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          OIDC_ROLE: ${{ secrets.OIDC_ROLE_ARN }}
        run: |
          if [ -z "$AWS_KEY" ] && [ -z "$OIDC_ROLE" ]; then
            echo "⚠️ AWS credentials not configured — skipping"
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 requests pynacl

      - name: Authenticate to AWS via OIDC
        id: oidc-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: garcar-provisioner
        continue-on-error: true

      - name: Fallback — Static creds (first-run bootstrap only)
        if: steps.oidc-auth.outcome == 'failure' && secrets.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: Run Zero-Touch Provisioner
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          AWS_REGION:         ${{ vars.AWS_REGION || 'us-east-1' }}
          AWS_ACCOUNT_ID:     ${{ vars.AWS_ACCOUNT_ID }}
          STRIPE_SECRET_KEY:  ${{ secrets.STRIPE_SECRET_KEY }}
          APOLLO_API_KEY:     ${{ secrets.APOLLO_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          LINEAR_API_KEY:     ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID:     ${{ secrets.LINEAR_TEAM_ID }}
          SES_SENDER_EMAIL:   ${{ secrets.SES_SENDER_EMAIL }}
        run: |
          SET_KEY="${{ github.event.inputs.set_key }}"
          if [ -n "$SET_KEY" ]; then
            python secrets_provisioner.py --set "$SET_KEY"
          else
            python secrets_provisioner.py
          fi

      - name: Commit provisioning log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "\U0001f511 secrets auto-provisioned -- $(date -u '+%Y-%m-%d %H:%M UTC')"
          file_pattern: provisioning_log.json
          commit_user_name: garcar-secrets-bot
          commit_user_email: secrets@garcar.io

      - name: Print Provisioning Summary
        run: |
          python3 << 'PYEOF'
          import json
          try:
              with open('provisioning_log.json') as f:
                  log = json.load(f)
              for e in log[-20:]:
                  icon = 'OK' if e['status'] == 'ok' else ('SKIP' if e['status'] == 'skip' else 'ERR')
                  print(f"  [{icon}] [{e['service']}] {e['key']}: {e['status']}")
          except Exception as ex:
              print(f'Could not read log: {ex}')
          PYEOF
