name: 🔑 Zero-Touch Secrets Provisioner
# Runs automatically on first push and on any secrets-related change.
# Uses GitHub OIDC to assume an AWS IAM role — NO static AWS keys needed.
# After this runs once, it self-registers everything into AWS + GitHub.

on:
  push:
    branches: [main]
    paths:
      - 'secrets_provisioner.py'
      - '.github/workflows/zero-touch-secrets.yml'
  workflow_dispatch:
    inputs:
      set_key:
        description: 'Optional: Set a single key (format: KEY_NAME=value)'
        required: false
        default: ''

permissions:
  id-token: write   # Required for OIDC — lets GitHub generate AWS token automatically
  contents: write   # Required to commit provisioning log
  secrets: write    # Required to write back GitHub secrets

jobs:
  provision:
    name: Zero-Touch Provision All Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 requests pynacl

      # OIDC — gets a temporary AWS token automatically from GitHub.
      # No AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY ever needed.
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN || vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: garcar-provisioner
        continue-on-error: true  # First run: OIDC role doesn't exist yet, bootstrap via fallback

      # Fallback for very first run only — uses static creds to create the OIDC role,
      # then OIDC takes over permanently after.
      - name: Fallback — Static creds (first-run bootstrap only)
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: Run Zero-Touch Provisioner
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          AWS_REGION:         ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          # Pass any already-known secrets so provisioner can detect & skip them
          STRIPE_SECRET_KEY:  ${{ secrets.STRIPE_SECRET_KEY }}
          APOLLO_API_KEY:     ${{ secrets.APOLLO_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          LINEAR_API_KEY:     ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID:     ${{ secrets.LINEAR_TEAM_ID }}
          SES_SENDER_EMAIL:   ${{ secrets.SES_SENDER_EMAIL }}
        run: |
          if [ -n "${{ github.event.inputs.set_key }}" ]; then
            python secrets_provisioner.py --set "${{ github.event.inputs.set_key }}"
          else
            python secrets_provisioner.py
          fi

      - name: Commit provisioning log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔑 secrets auto-provisioned — $(date -u '+%Y-%m-%d %H:%M UTC')"
          file_pattern: provisioning_log.json
          commit_user_name: garcar-secrets-bot
          commit_user_email: secrets@garcar.io

      - name: Print Provisioning Summary
        run: |
          echo ""
          echo "🔑 Provisioning complete. Log:"
          cat provisioning_log.json | python3 -c "
import json,sys
log = json.load(sys.stdin)
for e in log[-20:]:
    icon = '✅' if e['status']=='ok' else ('⚠️' if e['status']=='skip' else '❌')
    print(f\"  {icon} [{e['service']}] {e['key']}: {e['status']}\")
"
