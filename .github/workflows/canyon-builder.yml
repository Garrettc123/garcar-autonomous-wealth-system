name: 🏔️ Canyon Builder — Revenue-Gated Infrastructure Expansion

on:
  # Run every 6 hours to check if revenue threshold is met
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger with optional override threshold
  workflow_dispatch:
    inputs:
      revenue_threshold:
        description: 'Minimum Stripe balance (USD cents) required to begin the dig'
        required: false
        default: '50000'   # $500.00 default threshold
      canyon_tier:
        description: 'Canyon tier to build: tier-1 | tier-2 | tier-3'
        required: false
        default: 'tier-1'
      force_dig:
        description: 'Skip revenue check and force the dig (admin override)'
        required: false
        default: 'false'

  # Trigger from revenue engine reporting a new payment
  repository_dispatch:
    types: [revenue_milestone_reached, stripe_payment_succeeded]

env:
  REVENUE_THRESHOLD: ${{ github.event.inputs.revenue_threshold || '50000' }}
  CANYON_TIER: ${{ github.event.inputs.canyon_tier || 'tier-1' }}
  FORCE_DIG: ${{ github.event.inputs.force_dig || 'false' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # STEP 1 — Check Stripe balance against the revenue threshold
  # ─────────────────────────────────────────────────────────────
  revenue-gate:
    name: 💰 Revenue Gate — Can We Afford the Dig?
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      balance: ${{ steps.check.outputs.balance }}
      tier: ${{ steps.check.outputs.tier }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Stripe Balance vs Threshold
        id: check
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          echo "=== GARCAR CANYON BUILDER — Revenue Gate ==="
          echo "Threshold required : $REVENUE_THRESHOLD cents"
          echo "Force dig override : $FORCE_DIG"

          if [ "$FORCE_DIG" = "true" ]; then
            echo "⚡ Force dig enabled — bypassing revenue check"
            echo "approved=true"  >> $GITHUB_OUTPUT
            echo "balance=FORCED" >> $GITHUB_OUTPUT
            echo "tier=$CANYON_TIER" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::warning::STRIPE_SECRET_KEY not set — cannot verify revenue. Blocking dig."
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "balance=unknown" >> $GITHUB_OUTPUT
            echo "tier=$CANYON_TIER" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Query Stripe balance
          RESPONSE=$(curl -s -X GET https://api.stripe.com/v1/balance \
            -u "$STRIPE_SECRET_KEY:" \
            -H "Content-Type: application/x-www-form-urlencoded")

          echo "Stripe response: $RESPONSE"

          # Extract available USD balance (cents)
          AVAILABLE=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          available = data.get('available', [])
          usd = next((x['amount'] for x in available if x['currency'] == 'usd'), 0)
          print(usd)
          " 2>/dev/null || echo "0")

          echo "Available balance : $AVAILABLE cents (\$$(echo "scale=2; $AVAILABLE/100" | bc) USD)"
          echo "balance=$AVAILABLE" >> $GITHUB_OUTPUT

          # Auto-select canyon tier based on balance
          if [ "$AVAILABLE" -ge 1000000 ]; then
            TIER="tier-3"
          elif [ "$AVAILABLE" -ge 250000 ]; then
            TIER="tier-2"
          else
            TIER="tier-1"
          fi
          echo "tier=$TIER" >> $GITHUB_OUTPUT

          if [ "$AVAILABLE" -ge "$REVENUE_THRESHOLD" ]; then
            echo "✅ Revenue gate PASSED — dig is authorized"
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            DEFICIT=$(( REVENUE_THRESHOLD - AVAILABLE ))
            echo "🚫 Revenue gate FAILED — need $DEFICIT more cents (\$$(echo "scale=2; $DEFICIT/100" | bc) USD)"
            echo "approved=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────
  # STEP 2 — Log the gate decision
  # ─────────────────────────────────────────────────────────────
  gate-report:
    name: 📋 Gate Report
    needs: revenue-gate
    runs-on: ubuntu-latest
    steps:
      - name: Print Gate Outcome
        run: |
          echo "=================================="
          echo "  CANYON BUILDER — GATE REPORT"
          echo "=================================="
          echo "  Approved  : ${{ needs.revenue-gate.outputs.approved }}"
          echo "  Balance   : ${{ needs.revenue-gate.outputs.balance }} cents"
          echo "  Tier      : ${{ needs.revenue-gate.outputs.tier }}"
          echo "=================================="

          if [ "${{ needs.revenue-gate.outputs.approved }}" != "true" ]; then
            echo ""
            echo "💤 Canyon construction is on hold. Revenue not yet sufficient."
            echo "   The system will re-check every 6 hours automatically."
            echo "   To override, re-run with force_dig=true."
          fi

  # ─────────────────────────────────────────────────────────────
  # STEP 3 — Tier-1 Canyon Dig (entry-level infra: $500 min)
  # ─────────────────────────────────────────────────────────────
  canyon-tier-1:
    name: ⛏️ Dig Tier 1 — Foundation Layer
    needs: revenue-gate
    if: needs.revenue-gate.outputs.approved == 'true' && (needs.revenue-gate.outputs.tier == 'tier-1' || needs.revenue-gate.outputs.tier == 'tier-2' || needs.revenue-gate.outputs.tier == 'tier-3')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Tier-1 — Provision S3 Revenue Vault
        run: |
          echo "🪣 Creating Garcar Revenue Vault bucket..."
          aws s3api create-bucket \
            --bucket garcar-revenue-vault \
            --region us-east-1 \
            --create-bucket-configuration LocationConstraint=us-east-1 \
            2>/dev/null || echo "Bucket already exists — skipping"

          aws s3api put-bucket-versioning \
            --bucket garcar-revenue-vault \
            --versioning-configuration Status=Enabled

          echo "✅ Revenue vault ready"

      - name: Tier-1 — Tag Infrastructure with Revenue Stamp
        run: |
          BALANCE="${{ needs.revenue-gate.outputs.balance }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Stamping infrastructure with revenue snapshot: $BALANCE cents at $DATE"

          aws s3api put-bucket-tagging \
            --bucket garcar-revenue-vault \
            --tagging "TagSet=[
              {Key=Project,Value=GarcarCanyon},
              {Key=Tier,Value=tier-1},
              {Key=RevenueAtDig,Value=$BALANCE},
              {Key=DigDate,Value=$DATE},
              {Key=Owner,Value=GarcarEnterprise}
            ]" 2>/dev/null || echo "Tagging skipped"

          echo "✅ Tier-1 dig complete"

  # ─────────────────────────────────────────────────────────────
  # STEP 4 — Tier-2 Canyon Dig (scale layer: $2,500 min)
  # ─────────────────────────────────────────────────────────────
  canyon-tier-2:
    name: 🏗️ Dig Tier 2 — Scale Layer
    needs: [revenue-gate, canyon-tier-1]
    if: needs.revenue-gate.outputs.approved == 'true' && (needs.revenue-gate.outputs.tier == 'tier-2' || needs.revenue-gate.outputs.tier == 'tier-3')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Tier-2 — Provision DynamoDB Revenue Ledger
        run: |
          echo "📒 Creating Garcar Revenue Ledger (DynamoDB)..."
          aws dynamodb create-table \
            --table-name garcar-revenue-ledger \
            --attribute-definitions AttributeName=transaction_id,AttributeType=S \
            --key-schema AttributeName=transaction_id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region us-east-1 \
            2>/dev/null || echo "Table already exists — skipping"

          echo "✅ Revenue ledger ready"

      - name: Tier-2 — Enable Point-in-Time Recovery
        run: |
          aws dynamodb update-continuous-backups \
            --table-name garcar-revenue-ledger \
            --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true \
            --region us-east-1 \
            2>/dev/null || echo "PITR already enabled or table not ready"

          echo "✅ Tier-2 dig complete"

  # ─────────────────────────────────────────────────────────────
  # STEP 5 — Tier-3 Canyon Dig (full scale: $10,000 min)
  # ─────────────────────────────────────────────────────────────
  canyon-tier-3:
    name: 🏔️ Dig Tier 3 — Full Canyon Infrastructure
    needs: [revenue-gate, canyon-tier-2]
    if: needs.revenue-gate.outputs.approved == 'true' && needs.revenue-gate.outputs.tier == 'tier-3'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Tier-3 — Provision SQS Revenue Event Bus
        run: |
          echo "📨 Creating Garcar Revenue Event Bus (SQS)..."
          aws sqs create-queue \
            --queue-name garcar-revenue-events.fifo \
            --attributes FifoQueue=true,ContentBasedDeduplication=true \
            --region us-east-1 \
            2>/dev/null || echo "Queue already exists — skipping"

          echo "✅ Revenue event bus ready"

      - name: Tier-3 — Provision SNS Canyon Alert Topic
        run: |
          echo "📣 Creating Canyon Alert Topic (SNS)..."
          TOPIC_ARN=$(aws sns create-topic \
            --name garcar-canyon-alerts \
            --region us-east-1 \
            --query 'TopicArn' \
            --output text 2>/dev/null || echo "")

          echo "Topic ARN: $TOPIC_ARN"
          echo "✅ Canyon alert topic ready"

      - name: Tier-3 — Final Canyon Stamp
        run: |
          echo ""
          echo "🏔️ ════════════════════════════════════════ 🏔️"
          echo "     GARCAR CANYON FULLY DUG"
          echo "     Tier-3 infrastructure online"
          echo "     Revenue at dig: ${{ needs.revenue-gate.outputs.balance }} cents"
          echo "     Date: $(date -u)"
          echo "🏔️ ════════════════════════════════════════ 🏔️"

  # ─────────────────────────────────────────────────────────────
  # STEP 6 — Notify on successful dig
  # ─────────────────────────────────────────────────────────────
  notify-dig-complete:
    name: 📣 Notify — Canyon Dug
    needs: [revenue-gate, canyon-tier-1]
    if: always() && needs.revenue-gate.outputs.approved == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Post Dig Summary
        run: |
          echo "🎉 Canyon construction completed!"
          echo "Tier built  : ${{ needs.revenue-gate.outputs.tier }}"
          echo "Balance used: ${{ needs.revenue-gate.outputs.balance }} cents"
          echo "Time        : $(date -u)"
          echo ""
          echo "Next expansion check: +6 hours (automatic)"
