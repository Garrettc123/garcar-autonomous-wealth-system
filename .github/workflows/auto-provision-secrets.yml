name: "\U0001F510 Auto-Provision & Sync Secrets"
# This workflow is the self-healing secrets backbone.
# It runs:
#   - On every push to main (relevant files)
#   - On demand
#
# What it does:
#   1. Assumes the OIDC role (no static AWS keys stored anywhere)
#   2. Reads ALL secrets from AWS SSM /garcar/* (the single source of truth)
#   3. Provisions any missing AWS infrastructure (S3, SES, IAM role)
#   4. Encrypts and pushes every secret to GitHub Actions secrets
#   5. Next run of master-revenue-trigger picks them all up automatically
#
# To add a new secret permanently:
#   aws ssm put-parameter --name /garcar/MY_KEY --value "val" --type SecureString --overwrite
# That's it. It flows everywhere on next run.

on:
  push:
    branches: [main]
    paths:
      - 'secrets_provisioner.py'
      - '.github/workflows/auto-provision-secrets.yml'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force re-sync all secrets even if already present'
        required: false
        default: 'false'

permissions:
  id-token: write    # Required for OIDC
  contents: read
  secrets: write     # Required to write GitHub Actions secrets via API

jobs:
  provision:
    name: Provision & Sync All Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCOUNT" ] && [ -z "$AWS_KEY" ]; then
            echo "⚠️ Neither AWS_ACCOUNT_ID (OIDC) nor AWS_ACCESS_KEY_ID (static) configured — skipping"
            exit 0
          fi

      # -- Step 1: Authenticate to AWS via OIDC (NO static keys needed) --
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}::role/garcar-github-actions-role
          aws-region:     ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true   # First bootstrap run may not have role yet

      # -- Fallback: static keys if OIDC role not yet created --
      - name: Configure AWS via static keys (bootstrap fallback)
        if: ${{ env.AWS_ACCESS_KEY_ID == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 pynacl requests -q

      # -- Step 2: Run full provisioner --
      - name: Provision & sync secrets
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AWS_REGION:        ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: python secrets_provisioner.py

      # -- Step 3: Output status summary --
      - name: Summary
        run: |
          python3 << 'PYEOF'
          import json, os, boto3

          region = os.environ.get('AWS_REGION','us-east-1')
          try:
              ssm    = boto3.client('ssm', region_name=region)
              pager  = ssm.get_paginator('get_parameters_by_path')
              params = []
              for page in pager.paginate(Path='/garcar/', WithDecryption=False):
                  params.extend(page['Parameters'])

              print('\nSSM Parameters currently stored:')
              for p in sorted(params, key=lambda x: x['Name']):
                  name = p['Name'].replace('/garcar/','').upper()
                  # Mask value -- just show it exists
                  print(f'  {name:40s}  [SET]')
              print(f'\nTotal: {len(params)} keys in /garcar/ vault')
          except Exception as e:
              print(f'Could not list SSM params: {e}')
          PYEOF
