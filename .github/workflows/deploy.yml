name: "\U0001F680 Deploy to AWS Lambda"
# Deploy fires from:
#   1. master-revenue-trigger.yml (Stage 3, workflow_call)
#   2. Manual workflow_dispatch

on:
  workflow_call: {}
  workflow_dispatch:
    inputs:
      region_override:
        description: 'AWS region override (default: uses secret)'
        required: false
        default: ''

concurrency:
  group: deploy-lambda
  cancel-in-progress: false   # never cancel a deploy mid-flight

env:
  AWS_REGION:     ${{ secrets.AWS_REGION || 'us-east-1' }}
  PYTHON_VERSION: '3.11'
  NODE_VERSION:   '18'

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAMBDA_ROLE: ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ACCOUNT" ] && [ -z "$AWS_KEY" ]; then
            echo "⚠️ Neither AWS_ACCOUNT_ID (OIDC) nor AWS_ACCESS_KEY_ID (static) configured — skipping"
            exit 0
          fi
          if [ -z "$LAMBDA_ROLE" ]; then
            echo "⚠️ LAMBDA_EXECUTION_ROLE_ARN not configured — skipping"
            exit 0
          fi

      - name: AWS Auth (OIDC)
        id: oidc
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/garcar-github-actions-role
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: AWS Auth (static fallback)
        if: steps.oidc.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Package Python Lambda
        run: |
          mkdir -p build/python
          pip install -t build/python boto3 langchain openai stripe requests scikit-learn numpy pynacl -q
          for f in agent_coordinator.py linear_integration.py lead_acquisition.py \
                   lead_scoring.py aws_utils.py abundance_wallet.py \
                   stripe_webhook.py email_nurture.py customer_acquisition_loop.py; do
            [ -f "$f" ] && cp "$f" build/python/ || echo "Skip $f (not found)"
          done
          cd build/python && zip -r ../orchestrator.zip . && cd ../..

      - name: Package Node Lambda
        run: |
          mkdir -p build/nodejs
          [ -f revenue_agent.js ] && cp revenue_agent.js build/nodejs/index.js || echo "Skip revenue_agent.js"
          [ -f package.json ]     && cp package.json build/nodejs/             || echo "Skip package.json"
          cd build/nodejs && npm install --production 2>/dev/null || true
          zip -r ../revenue_agent.zip . && cd ../..

      - name: Deploy Orchestrator Lambda
        env:
          DEPLOY_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          LAMBDA_ROLE: ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          if [ -z "$LAMBDA_ROLE" ]; then echo "⚠️ LAMBDA_EXECUTION_ROLE_ARN not set — skipping"; exit 0; fi
          aws lambda update-function-code \
            --function-name garcar-orchestrator \
            --zip-file fileb://build/orchestrator.zip \
            --region "$DEPLOY_REGION" \
          || aws lambda create-function \
            --function-name garcar-orchestrator \
            --runtime python3.11 \
            --role "$LAMBDA_ROLE" \
            --handler agent_coordinator.lambda_handler \
            --zip-file fileb://build/orchestrator.zip \
            --timeout 300 --memory-size 512 \
            --region "$DEPLOY_REGION"
        continue-on-error: true

      - name: Deploy Stripe Webhook Lambda
        env:
          DEPLOY_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          LAMBDA_ROLE: ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          if [ -z "$LAMBDA_ROLE" ]; then echo "⚠️ LAMBDA_EXECUTION_ROLE_ARN not set — skipping"; exit 0; fi
          aws lambda update-function-code \
            --function-name garcar-stripe-webhook \
            --zip-file fileb://build/orchestrator.zip \
            --region "$DEPLOY_REGION" \
          || aws lambda create-function \
            --function-name garcar-stripe-webhook \
            --runtime python3.11 \
            --role "$LAMBDA_ROLE" \
            --handler stripe_webhook.lambda_handler \
            --zip-file fileb://build/orchestrator.zip \
            --timeout 30 --memory-size 256 \
            --region "$DEPLOY_REGION"
        continue-on-error: true

      - name: Deploy Revenue Agent Lambda
        env:
          DEPLOY_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          LAMBDA_ROLE: ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          if [ -z "$LAMBDA_ROLE" ]; then echo "⚠️ LAMBDA_EXECUTION_ROLE_ARN not set — skipping"; exit 0; fi
          aws lambda update-function-code \
            --function-name garcar-revenue-agent \
            --zip-file fileb://build/revenue_agent.zip \
            --region "$DEPLOY_REGION" \
          || aws lambda create-function \
            --function-name garcar-revenue-agent \
            --runtime nodejs18.x \
            --role "$LAMBDA_ROLE" \
            --handler index.handler \
            --zip-file fileb://build/revenue_agent.zip \
            --timeout 300 --memory-size 512 \
            --region "$DEPLOY_REGION"
        continue-on-error: true

      - name: Update Lambda Env Vars
        env:
          AWS_REGION:            ${{ secrets.AWS_REGION || 'us-east-1' }}
          S3_BUCKET:             ${{ secrets.S3_BUCKET }}
          STRIPE_SECRET_KEY:     ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_PRO:      ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LINEAR_API_KEY:        ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID:        ${{ secrets.LINEAR_TEAM_ID }}
          APOLLO_API_KEY:        ${{ secrets.APOLLO_API_KEY }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          SES_SENDER_EMAIL:      ${{ secrets.SES_SENDER_EMAIL }}
          DASHBOARD_URL:         ${{ secrets.DASHBOARD_URL || 'https://app.garcar.io/dashboard' }}
          UPGRADE_URL:           ${{ secrets.UPGRADE_URL   || 'https://app.garcar.io/upgrade' }}
          ALW_LEDGER_PATH:       /tmp/alw_ledger.json
          ACQ_LEDGER_PATH:       /tmp/acquisition_ledger.json
        run: |
          python3 << 'PYEOF'
          import subprocess, json, os
          region = os.environ.get('AWS_REGION', 'us-east-1')
          LAMBDAS = {
              'garcar-orchestrator':   ['S3_BUCKET','STRIPE_SECRET_KEY','LINEAR_API_KEY','LINEAR_TEAM_ID','APOLLO_API_KEY','OPENAI_API_KEY','SES_SENDER_EMAIL','DASHBOARD_URL','UPGRADE_URL','ALW_LEDGER_PATH','ACQ_LEDGER_PATH'],
              'garcar-stripe-webhook': ['STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','S3_BUCKET','ALW_LEDGER_PATH'],
              'garcar-revenue-agent':  ['S3_BUCKET','STRIPE_SECRET_KEY','STRIPE_PRICE_PRO','STRIPE_WEBHOOK_SECRET','LINEAR_API_KEY','LINEAR_TEAM_ID'],
          }
          for fn, keys in LAMBDAS.items():
              env_vars = {k: os.environ[k] for k in keys if os.environ.get(k)}
              if not env_vars: print(f'Skip {fn} (no vars)'); continue
              r = subprocess.run(['aws','lambda','update-function-configuration','--function-name',fn,'--environment',json.dumps({'Variables':env_vars}),'--region',region], capture_output=True, text=True)
              print(f'{"OK" if r.returncode==0 else "WARN"} {fn} ({len(env_vars)} vars)')
          PYEOF
        continue-on-error: true

      - name: Smoke test Lambda
        env:
          DEPLOY_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          aws lambda invoke \
            --function-name garcar-orchestrator \
            --region "$DEPLOY_REGION" \
            --payload '{}' response.json 2>&1 && cat response.json || echo "Lambda cold start or not yet created — OK"
        continue-on-error: true

      - name: Deploy summary
        env:
          DEPLOY_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          echo "✅ Lambda deploy complete"
          echo "  Orchestrator:   https://console.aws.amazon.com/lambda/home?region=$DEPLOY_REGION#/functions/garcar-orchestrator"
          echo "  Stripe Webhook: https://console.aws.amazon.com/lambda/home?region=$DEPLOY_REGION#/functions/garcar-stripe-webhook"
          echo "  Revenue Agent:  https://console.aws.amazon.com/lambda/home?region=$DEPLOY_REGION#/functions/garcar-revenue-agent"
