name: Deploy Garcar Autonomous Wealth System

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Package Python Lambda (Orchestrator)
        run: |
          mkdir -p build/python
          pip install -t build/python boto3 langchain openai stripe requests
          for f in agent_coordinator.py linear_integration.py lead_acquisition.py; do
            [ -f "$f" ] && cp "$f" build/python/ || echo "Warning: $f not found, skipping"
          done
          cd build/python && zip -r ../orchestrator.zip . && cd ../..

      - name: Package Node.js Lambda (Revenue Agent)
        run: |
          mkdir -p build/nodejs
          [ -f revenue_agent.js ] && cp revenue_agent.js build/nodejs/index.js || echo "Warning: revenue_agent.js not found"
          [ -f package.json ]    && cp package.json    build/nodejs/          || echo "Warning: package.json not found"
          cd build/nodejs && npm install --production 2>/dev/null || true
          zip -r ../revenue_agent.zip . && cd ../..

      - name: Deploy Orchestrator Lambda
        run: |
          aws lambda update-function-code \
            --function-name garcar-orchestrator \
            --zip-file fileb://build/orchestrator.zip \
            --region ${{ env.AWS_REGION }} \
          || aws lambda create-function \
            --function-name garcar-orchestrator \
            --runtime python3.11 \
            --role ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }} \
            --handler agent_coordinator.lambda_handler \
            --zip-file fileb://build/orchestrator.zip \
            --timeout 300 \
            --memory-size 512 \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Revenue Agent Lambda
        run: |
          aws lambda update-function-code \
            --function-name garcar-revenue-agent \
            --zip-file fileb://build/revenue_agent.zip \
            --region ${{ env.AWS_REGION }} \
          || aws lambda create-function \
            --function-name garcar-revenue-agent \
            --runtime nodejs18.x \
            --role ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }} \
            --handler index.handler \
            --zip-file fileb://build/revenue_agent.zip \
            --timeout 300 \
            --memory-size 512 \
            --region ${{ env.AWS_REGION }}

      - name: Update Lambda Environment Variables
        run: |
          python3 << 'PYEOF'
          import subprocess, json, os

          region = os.environ.get('AWS_REGION', 'us-west-2')

          orchestrator_vars = {
              'S3_BUCKET':          os.environ.get('S3_BUCKET', ''),
              'STRIPE_SECRET_KEY':  os.environ.get('STRIPE_SECRET_KEY', ''),
              'LINEAR_API_KEY':     os.environ.get('LINEAR_API_KEY', ''),
              'LINEAR_TEAM_ID':     os.environ.get('LINEAR_TEAM_ID', ''),
              'APOLLO_API_KEY':     os.environ.get('APOLLO_API_KEY', ''),
              'OPENAI_API_KEY':     os.environ.get('OPENAI_API_KEY', ''),
          }
          revenue_vars = {
              'S3_BUCKET':              os.environ.get('S3_BUCKET', ''),
              'STRIPE_SECRET_KEY':      os.environ.get('STRIPE_SECRET_KEY', ''),
              'STRIPE_PRICE_ID':        os.environ.get('STRIPE_PRICE_PRO', ''),
              'STRIPE_WEBHOOK_SECRET':  os.environ.get('STRIPE_WEBHOOK_SECRET', ''),
              'LINEAR_API_KEY':         os.environ.get('LINEAR_API_KEY', ''),
              'LINEAR_TEAM_ID':         os.environ.get('LINEAR_TEAM_ID', ''),
          }

          for fn, env_vars in [('garcar-orchestrator', orchestrator_vars), ('garcar-revenue-agent', revenue_vars)]:
              env_str = json.dumps({'Variables': {k: v for k, v in env_vars.items() if v}})
              cmd = ['aws', 'lambda', 'update-function-configuration',
                     '--function-name', fn,
                     '--environment', env_str,
                     '--region', region]
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode == 0:
                  print(f'Updated env vars for {fn}')
              else:
                  print(f'Warning updating {fn}: {result.stderr[:200]}')
          PYEOF
        env:
          AWS_REGION:           ${{ env.AWS_REGION }}
          S3_BUCKET:            ${{ secrets.S3_BUCKET }}
          STRIPE_SECRET_KEY:    ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_PRO:     ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LINEAR_API_KEY:       ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID:       ${{ secrets.LINEAR_TEAM_ID }}
          APOLLO_API_KEY:       ${{ secrets.APOLLO_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}

      - name: Test Deployment
        run: |
          aws lambda invoke \
            --function-name garcar-orchestrator \
            --region ${{ env.AWS_REGION }} \
            --payload '{}' \
            response.json && cat response.json || echo "Lambda invocation failed — function may not exist yet."

      - name: Deployment Summary
        run: |
          echo "Deployment complete."
          echo "Orchestrator : https://console.aws.amazon.com/lambda/home?region=${{ env.AWS_REGION }}#/functions/garcar-orchestrator"
          echo "Revenue Agent: https://console.aws.amazon.com/lambda/home?region=${{ env.AWS_REGION }}#/functions/garcar-revenue-agent"
