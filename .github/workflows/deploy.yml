name: Deploy Garcar Autonomous Wealth System

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION:     ${{ secrets.AWS_REGION || 'us-east-1' }}   # fixed: was hardcoded us-west-2
  PYTHON_VERSION: '3.11'
  NODE_VERSION:   '18'

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Package Python Lambda (Orchestrator + Webhook)
        run: |
          mkdir -p build/python
          pip install -t build/python boto3 langchain openai stripe requests scikit-learn numpy pynacl
          for f in agent_coordinator.py linear_integration.py lead_acquisition.py \
                   lead_scoring.py aws_utils.py abundance_wallet.py \
                   stripe_webhook.py email_nurture.py customer_acquisition_loop.py; do
            [ -f "$f" ] && cp "$f" build/python/ || echo "Warning: $f not found, skipping"
          done
          cd build/python && zip -r ../orchestrator.zip . && cd ../..

      - name: Package Node.js Lambda (Revenue Agent)
        run: |
          mkdir -p build/nodejs
          [ -f revenue_agent.js ] && cp revenue_agent.js build/nodejs/index.js || echo "Warning: revenue_agent.js not found"
          [ -f package.json ]     && cp package.json     build/nodejs/          || echo "Warning: package.json not found"
          cd build/nodejs && npm install --production 2>/dev/null || true
          zip -r ../revenue_agent.zip . && cd ../..

      - name: Deploy Orchestrator Lambda
        run: |
          aws lambda update-function-code \
            --function-name garcar-orchestrator \
            --zip-file fileb://build/orchestrator.zip \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} \
          || aws lambda create-function \
            --function-name garcar-orchestrator \
            --runtime python3.11 \
            --role ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }} \
            --handler agent_coordinator.lambda_handler \
            --zip-file fileb://build/orchestrator.zip \
            --timeout 300 \
            --memory-size 512 \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy Stripe Webhook Lambda
        run: |
          aws lambda update-function-code \
            --function-name garcar-stripe-webhook \
            --zip-file fileb://build/orchestrator.zip \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} \
          || aws lambda create-function \
            --function-name garcar-stripe-webhook \
            --runtime python3.11 \
            --role ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }} \
            --handler stripe_webhook.lambda_handler \
            --zip-file fileb://build/orchestrator.zip \
            --timeout 30 \
            --memory-size 256 \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy Revenue Agent Lambda
        run: |
          aws lambda update-function-code \
            --function-name garcar-revenue-agent \
            --zip-file fileb://build/revenue_agent.zip \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} \
          || aws lambda create-function \
            --function-name garcar-revenue-agent \
            --runtime nodejs18.x \
            --role ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }} \
            --handler index.handler \
            --zip-file fileb://build/revenue_agent.zip \
            --timeout 300 \
            --memory-size 512 \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Update Lambda Environment Variables
        env:
          AWS_REGION:            ${{ secrets.AWS_REGION || 'us-east-1' }}
          S3_BUCKET:             ${{ secrets.S3_BUCKET }}
          STRIPE_SECRET_KEY:     ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_PRO:      ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LINEAR_API_KEY:        ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID:        ${{ secrets.LINEAR_TEAM_ID }}
          APOLLO_API_KEY:        ${{ secrets.APOLLO_API_KEY }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          SES_SENDER_EMAIL:      ${{ secrets.SES_SENDER_EMAIL }}
          DASHBOARD_URL:         ${{ secrets.DASHBOARD_URL || 'https://app.garcar.io/dashboard' }}
          UPGRADE_URL:           ${{ secrets.UPGRADE_URL   || 'https://app.garcar.io/upgrade' }}
          ALW_LEDGER_PATH:       /tmp/alw_ledger.json
          ACQ_LEDGER_PATH:       /tmp/acquisition_ledger.json
        run: |
          python3 << 'PYEOF'
          import subprocess, json, os

          region = os.environ.get('AWS_REGION', 'us-east-1')

          LAMBDAS = {
              'garcar-orchestrator': [
                  'S3_BUCKET','STRIPE_SECRET_KEY','LINEAR_API_KEY','LINEAR_TEAM_ID',
                  'APOLLO_API_KEY','OPENAI_API_KEY','SES_SENDER_EMAIL',
                  'DASHBOARD_URL','UPGRADE_URL','ALW_LEDGER_PATH','ACQ_LEDGER_PATH',
              ],
              'garcar-stripe-webhook': [
                  'STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','S3_BUCKET',
                  'ALW_LEDGER_PATH',
              ],
              'garcar-revenue-agent': [
                  'S3_BUCKET','STRIPE_SECRET_KEY','STRIPE_PRICE_PRO',
                  'STRIPE_WEBHOOK_SECRET','LINEAR_API_KEY','LINEAR_TEAM_ID',
              ],
          }

          for fn, keys in LAMBDAS.items():
              env_vars = {k: os.environ[k] for k in keys if os.environ.get(k)}
              if not env_vars:
                  print(f'No env vars to set for {fn}, skipping')
                  continue
              cmd = ['aws','lambda','update-function-configuration',
                     '--function-name', fn,
                     '--environment', json.dumps({'Variables': env_vars}),
                     '--region', region]
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode == 0:
                  print(f'Updated {fn} ({len(env_vars)} vars)')
              else:
                  print(f'Warning {fn}: {r.stderr[:300]}')
          PYEOF

      - name: Test Orchestrator Lambda
        run: |
          aws lambda invoke \
            --function-name garcar-orchestrator \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} \
            --payload '{}' \
            response.json && cat response.json \
          || echo "Lambda invocation failed — may not exist yet or needs cold start."

      - name: Deployment Summary
        run: |
          REGION=${{ secrets.AWS_REGION || 'us-east-1' }}
          echo "Deployment complete."
          echo "Orchestrator:    https://console.aws.amazon.com/lambda/home?region=$REGION#/functions/garcar-orchestrator"
          echo "Stripe Webhook:  https://console.aws.amazon.com/lambda/home?region=$REGION#/functions/garcar-stripe-webhook"
          echo "Revenue Agent:   https://console.aws.amazon.com/lambda/home?region=$REGION#/functions/garcar-revenue-agent"
