name: 🚀 GARCAR MASS DEPLOY — ALL SYSTEMS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm full system launch"
        required: true
        default: "DEPLOY"

concurrency:
  group: mass-deploy
  cancel-in-progress: false

jobs:

  # ─── PHASE 0: SECRETS & KEYS (must go first) ───────────────────────────────
  phase0-secrets-bootstrap:
    name: "⚙️ [P0] Secrets Bootstrap"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger secrets-bootstrap
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'secrets-bootstrap.yml',
              ref: 'main'
            });
            console.log('✅ secrets-bootstrap.yml triggered');

  phase0-auto-provision-secrets:
    name: "⚙️ [P0] Auto Provision Secrets"
    runs-on: ubuntu-latest
    needs: phase0-secrets-bootstrap
    steps:
      - uses: actions/checkout@v4
      - name: Trigger auto-provision-secrets
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-provision-secrets.yml',
              ref: 'main'
            });
            console.log('✅ auto-provision-secrets.yml triggered');

  phase0-zero-touch-secrets:
    name: "⚙️ [P0] Zero Touch Secrets"
    runs-on: ubuntu-latest
    needs: phase0-auto-provision-secrets
    steps:
      - uses: actions/checkout@v4
      - name: Trigger zero-touch-secrets
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'zero-touch-secrets.yml',
              ref: 'main'
            });
            console.log('✅ zero-touch-secrets.yml triggered');

  phase0-bootstrap-aws-keys:
    name: "⚙️ [P0] Bootstrap AWS Keys"
    runs-on: ubuntu-latest
    needs: phase0-zero-touch-secrets
    steps:
      - uses: actions/checkout@v4
      - name: Trigger bootstrap-aws-keys
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bootstrap-aws-keys.yml',
              ref: 'main'
            });
            console.log('✅ bootstrap-aws-keys.yml triggered');

  phase0-auto-rotate-keys:
    name: "⚙️ [P0] Auto Rotate Keys"
