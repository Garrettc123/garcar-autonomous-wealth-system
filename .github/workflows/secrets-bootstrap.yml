name: 🔑 Auto Secrets Bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap-secrets:
    name: Push All Secrets to AWS Secrets Manager
    runs-on: ubuntu-latest

    steps:
      - name: Check AWS secrets
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "⚠️ AWS_ACCESS_KEY_ID not configured — skipping"
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Bundle & push all secrets to AWS Secrets Manager
        env:
          STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY:    ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET:     ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_BASIC:        ${{ secrets.STRIPE_PRICE_BASIC }}
          STRIPE_PRICE_PRO:          ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_ENTERPRISE:   ${{ secrets.STRIPE_PRICE_ENTERPRISE }}
          APOLLO_API_KEY:            ${{ secrets.APOLLO_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          SES_SENDER_EMAIL:          ${{ secrets.SES_SENDER_EMAIL }}
          TWILIO_ACCOUNT_SID:        ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:         ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER:        ${{ secrets.TWILIO_FROM_NUMBER }}
          LINEAR_API_KEY:            ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID:            ${{ secrets.LINEAR_TEAM_ID }}
          S3_BUCKET:                 ${{ secrets.S3_BUCKET }}
          KMS_KEY_ID:                ${{ secrets.KMS_KEY_ID }}
          LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}
          DASHBOARD_API_KEY:         ${{ secrets.DASHBOARD_API_KEY }}
          AWS_REGION:                ${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCOUNT_ID:            ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, boto3

          keys = [
              'STRIPE_SECRET_KEY', 'STRIPE_PUBLISHABLE_KEY', 'STRIPE_WEBHOOK_SECRET',
              'STRIPE_PRICE_BASIC', 'STRIPE_PRICE_PRO', 'STRIPE_PRICE_ENTERPRISE',
              'APOLLO_API_KEY', 'OPENAI_API_KEY', 'SES_SENDER_EMAIL',
              'TWILIO_ACCOUNT_SID', 'TWILIO_AUTH_TOKEN', 'TWILIO_FROM_NUMBER',
              'LINEAR_API_KEY', 'LINEAR_TEAM_ID',
              'S3_BUCKET', 'KMS_KEY_ID', 'LAMBDA_EXECUTION_ROLE_ARN',
              'DASHBOARD_API_KEY', 'AWS_REGION', 'AWS_ACCOUNT_ID',
          ]

          bundle = {k: os.environ[k] for k in keys if os.environ.get(k)}
          print(f'Bundling {len(bundle)} secrets...')

          client = boto3.client('secretsmanager', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
          secret_name = 'garcar/all'

          try:
              client.put_secret_value(SecretId=secret_name, SecretString=json.dumps(bundle))
              print(f'Updated existing secret: {secret_name}')
          except client.exceptions.ResourceNotFoundException:
              client.create_secret(Name=secret_name, SecretString=json.dumps(bundle))
              print(f'Created new secret bundle: {secret_name}')
          except Exception as e:
              print(f'Error: {e}')
              raise

          print(f'garcar/all bundle now contains {len(bundle)} keys.')
          print('Keys bundled: ' + ', '.join(bundle.keys()))
          PYEOF

      - name: Verify bundle in AWS
        run: |
          aws secretsmanager describe-secret --secret-id garcar/all \
            --query '{Name:Name,LastChangedDate:LastChangedDate}' \
            --output table
