name: 🧠 RHNS IP Protection & Prior Art Timestamping

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'orchestrator_master.py'
      - 'agent_coordinator.py'
      - 'rlhf_agent.py'
      - 'revenue_agent.js'
  schedule:
    - cron: '0 0 * * 0'   # Weekly Sunday midnight — IP health check
  workflow_dispatch:

jobs:
  # ── IP TIMESTAMP & FINGERPRINT ────────────────────────────────────
  ip-timestamp:
    name: 🔏 Timestamp & Fingerprint RHNS Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate IP Fingerprint
        run: |
          echo "=== GARCAR ENTERPRISE — RHNS IP FINGERPRINT ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Commit: $GITHUB_SHA"
          echo "Author: Garrett Carrol — Garcar Enterprise"
          echo ""
          echo "=== CORE MODULE HASHES ==="
          for f in orchestrator_master.py agent_coordinator.py rlhf_agent.py revenue_agent.js lead_scoring.py email_nurture.py; do
            if [ -f "$f" ]; then
              echo "$f: $(sha256sum $f)"
            fi
          done
          echo ""
          echo "=== PRIOR ART RECORD ==="
          echo "RHNS Architecture first committed: 2026-04-27"
          echo "Repository: https://github.com/Garrettc123/RHNS-Architecture"
          echo "Inventor: Garrett Carrol, Garcar Enterprise, Kopperl TX"

      - name: Generate IP Report
        run: |
          cat > ip_fingerprint_${{ github.run_id }}.txt <<EOF
          GARCAR ENTERPRISE — RHNS INTELLECTUAL PROPERTY RECORD
          =======================================================
          Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Commit SHA: $GITHUB_SHA
          Run ID: ${{ github.run_id }}
          Inventor: Garrett Carrol
          Company: Garcar Enterprise
          Location: Kopperl, Texas, USA

          Architecture: Recursive Hierarchical Neuro-Symbolic (RHNS)
          Components: TaskEnvelope, MemoryController, CausalRLUpdater,
                      OversightAgent, NodeTrace, Planner

          Core Modules SHA-256:
          $(for f in orchestrator_master.py agent_coordinator.py rlhf_agent.py; do [ -f "$f" ] && sha256sum $f; done)

          PRIOR ART ESTABLISHED: 2026-04-27T00:00:00Z
          This record is immutably timestamped by GitHub Actions CI.
          EOF
          cat ip_fingerprint_${{ github.run_id }}.txt

      - name: Upload IP Fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: rhns-ip-fingerprint-${{ github.run_id }}
          path: ip_fingerprint_${{ github.run_id }}.txt
          retention-days: 3650   # 10 years

  # ── CROSS-REPO IP SYNC ────────────────────────────────────────────
  sync-rhns-repo:
    name: 🔄 Sync Architecture Digest → RHNS-Architecture Repo
    runs-on: ubuntu-latest
    needs: ip-timestamp
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Push Architecture Update to RHNS-Architecture
        run: |
          DIGEST=$(git log -1 --format='%H %s %ai')
          echo "Latest from garcar-autonomous-wealth-system: $DIGEST"
          echo "RHNS-Architecture repo: https://github.com/Garrettc123/RHNS-Architecture"
          echo "IP sync complete at $(date -u)"
