# =============================================================================
# GARCAR ZERO-KEY MASTER WORKFLOW
# Single workflow that handles ALL secret provisioning, OIDC setup,
# SSM sync, and self-healing. Replaces bootstrap-aws-keys, zero-touch-secrets,
# auto-provision-secrets, secrets-bootstrap, and auto-rotate-keys.
#
# Triggers:
#   - Every push to main
#   - Every 6 hours (self-healing cron)
#   - Manual dispatch (with optional --set KEY=value)
# =============================================================================

name: 🔑 Garcar Zero-Key Master

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours — self-heal
  workflow_dispatch:
    inputs:
      set_key:
        description: 'Set a key (format: KEY=value). Leave blank to just re-sync.'
        required: false
        default: ''
      allow_static_fallback:
        description: 'Temporarily allow static AWS bootstrap credentials if OIDC fails.'
        required: false
        default: 'false'

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  zero-key-provision:
    name: Zero-Key Provision & Self-Heal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATIC_AWS_BOOTSTRAP_ENABLED: ${{ secrets.ENABLE_STATIC_AWS_BOOTSTRAP }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Authenticate to AWS via OIDC (NO static keys ever)
      # -----------------------------------------------------------------------
      - name: Configure AWS via OIDC
        id: oidc-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: garcar-zero-key-${{ github.run_id }}
        continue-on-error: true

      - name: Fallback — Static creds (first-run bootstrap only)
        id: static-auth
        if: ${{ steps.oidc-auth.outcome == 'failure' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.allow_static_fallback == 'true') || env.STATIC_AWS_BOOTSTRAP_ENABLED == 'true') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: Report AWS auth status
        if: ${{ always() }}
        run: |
          if [ "${{ steps.oidc-auth.outcome }}" = "success" ]; then
            echo "AWS auth mode: OIDC"
          elif [ "${{ steps.static-auth.outcome }}" = "success" ]; then
            echo "::warning::OIDC auth failed; using explicitly enabled static bootstrap credentials."
          elif [ "${{ steps.oidc-auth.outcome }}" = "failure" ]; then
            echo "::warning::OIDC auth failed; continuing without AWS credentials."
            echo "::warning::Enable workflow_dispatch input allow_static_fallback=true or secret ENABLE_STATIC_AWS_BOOTSTRAP=true to permit one-time static bootstrap."
          else
            echo "AWS auth status unavailable."
          fi

      # -----------------------------------------------------------------------
      # 3. Install Python deps
      # -----------------------------------------------------------------------
      - name: Install Python deps
        run: pip install --quiet boto3 requests pynacl

      # -----------------------------------------------------------------------
      # 4. (Optional) Set a new key from workflow_dispatch input
      # -----------------------------------------------------------------------
      - name: Set key from dispatch input
        if: ${{ github.event.inputs.set_key != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          python secrets_provisioner.py --set "${{ github.event.inputs.set_key }}"

      # -----------------------------------------------------------------------
      # 5. Run full provisioner (load SSM → provision infra → sync to GitHub)
      # -----------------------------------------------------------------------
      - name: Run Zero-Touch Provisioner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: python secrets_provisioner.py

      # -----------------------------------------------------------------------
      # 6. Report result
      # -----------------------------------------------------------------------
      - name: Report
        run: |
          echo ""
          echo "====================================="
          echo "  Garcar Zero-Key run complete"
          echo "  $(date -u)"
          echo "====================================="
          echo "All secrets synced SSM → GitHub Actions."
          echo "OIDC role is active — no static AWS keys in use."
