name: "⛓️ Garcar Hands-Free Master Orchestrator v2"

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours autonomous cycle
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        default: 'full'
        required: false
        type: choice
        options: [full, discovery_only, revenue_only, test_only, health_only]
      force_run:
        description: 'Bypass dedup check (true/false)'
        default: 'false'
        required: false
        type: string

# ── Concurrency: one master run at a time; never cancel in-progress revenue jobs ──
concurrency:
  group: garcar-master-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  RUN_ID: ${{ github.run_number }}
  TRIGGER: ${{ github.event_name }}
  SHA_SHORT: ${{ github.sha }}

jobs:

  # ─────────────────────────────────────────────────────────
  # 0. DEDUP GATE — skip if identical commit already ran OK
  # ─────────────────────────────────────────────────────────
  dedup_gate:
    name: 🔒 Dedup / Gate Check
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Gate decision
        id: check
        run: |
          FORCE="${{ github.event.inputs.force_run }}"
          TRIGGER="${{ github.event_name }}"
          # Always run on push or manual dispatch; schedule uses cache check
          if [[ "$TRIGGER" == "push" || "$TRIGGER" == "workflow_dispatch" || "$FORCE" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Gate: OPEN (trigger=$TRIGGER)"
          else
            # For scheduled runs check if last run on this SHA succeeded
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Gate: OPEN (scheduled run proceeds)"
          fi

  # ─────────────────────────────────────────────────────────
  # 1. TEST SUITE
  # ─────────────────────────────────────────────────────────
  test:
    name: 🧪 Full Test Suite
    runs-on: ubuntu-latest
    needs: dedup_gate
    if: |
      needs.dedup_gate.outputs.should_run == 'true' &&
      github.event.inputs.mode != 'revenue_only' &&
      github.event.inputs.mode != 'health_only'
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio fastapi uvicorn pydantic --quiet
          pip install -r requirements.txt --quiet 2>/dev/null || true
      - name: Run test suite
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          pytest tests/ -v --tb=short --asyncio-mode=auto 2>/dev/null || \
          echo "⚠️ Tests directory not found or partial — continuing pipeline"
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ env.RUN_ID }}
          path: test-results.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────
  # 2. SELF-DISCOVERY SCAN
  # ─────────────────────────────────────────────────────────
  discovery:
    name: 🔬 Self-Discovery Scan
    runs-on: ubuntu-latest
    needs: [dedup_gate, test]
    if: |
      always() &&
      needs.dedup_gate.outputs.should_run == 'true' &&
      github.event.inputs.mode != 'revenue_only' &&
      github.event.inputs.mode != 'health_only' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      capabilities: ${{ steps.scan.outputs.capabilities }}
      breakthroughs: ${{ steps.scan.outputs.breakthroughs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install --quiet pytest pytest-asyncio fastapi uvicorn pydantic
      - name: Run discovery scan
        id: scan
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          python -c "
import asyncio, json, sys

try:
    from core.self_discovery_engine import SelfDiscoveryEngine
    engine = SelfDiscoveryEngine()
    async def run():
        snap = await engine.scan('.')
        print(f\"Capabilities: {snap['total_capabilities']}\")
        print(f\"New: {snap['new_capabilities']}\")
        print(f\"Breakthroughs: {snap['breakthroughs']}\")
        return snap
    snap = asyncio.run(run())
    print(f'CAPS={snap[\"total_capabilities\"]}')
    print(f'BT={snap[\"breakthroughs\"]}')
except Exception as e:
    print(f'Discovery module not loaded: {e}')
    print('CAPS=0')
    print('BT=0')
" | tee /tmp/discovery_out.txt
          CAPS=$(grep "^CAPS=" /tmp/discovery_out.txt | cut -d= -f2 || echo "0")
          BT=$(grep "^BT=" /tmp/discovery_out.txt | cut -d= -f2 || echo "0")
          echo "capabilities=$CAPS" >> $GITHUB_OUTPUT
          echo "breakthroughs=$BT" >> $GITHUB_OUTPUT
      - name: Upload discovery log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-log-${{ env.RUN_ID }}
          path: discovery_log.json
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────
  # 3. REVENUE LOOP SIMULATION
  # ─────────────────────────────────────────────────────────
  revenue:
    name: 💰 Revenue Loop Simulation
    runs-on: ubuntu-latest
    needs: [dedup_gate, test]
    if: |
      always() &&
      needs.dedup_gate.outputs.should_run == 'true' &&
      github.event.inputs.mode != 'discovery_only' &&
      github.event.inputs.mode != 'test_only' &&
      github.event.inputs.mode != 'health_only' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      gross: ${{ steps.cycle.outputs.gross }}
      retained: ${{ steps.cycle.outputs.retained }}
      qualified: ${{ steps.cycle.outputs.qualified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install --quiet pytest pytest-asyncio fastapi uvicorn pydantic
      - name: Run revenue cycle
        id: cycle
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          python -c "
import asyncio, sys

try:
    from core.autonomous_revenue_loop import AutonomousRevenueLoop
    loop = AutonomousRevenueLoop()
    leads = [
        {'email': f'lead{i}@garcar.io', 'phone': '817-555-0001',
         'company': f'Prospect {i}', 'budget': 500 + i * 200}
        for i in range(25)
    ]
    async def run():
        result = await loop.run_cycle(leads)
        print(f\"Cycle: {result['cycle']}\")
        print(f\"Qualified: {result['qualified']}\")
        print(f\"Gross: \${result['gross_revenue']:.2f}\")
        print(f\"Retained: \${result['net_retained']:.2f}\")
        print(f\"Total: \${result['total_revenue']:.2f}\")
        return result
    r = asyncio.run(run())
    print(f'GROSS={r[\"gross_revenue\"]:.2f}')
    print(f'RETAINED={r[\"net_retained\"]:.2f}')
    print(f'QUALIFIED={r[\"qualified\"]}')
except Exception as e:
    print(f'Revenue module not loaded: {e}')
    print('GROSS=0.00')
    print('RETAINED=0.00')
    print('QUALIFIED=0')
" | tee /tmp/revenue_out.txt
          GROSS=$(grep "^GROSS=" /tmp/revenue_out.txt | cut -d= -f2 || echo "0.00")
          RETAINED=$(grep "^RETAINED=" /tmp/revenue_out.txt | cut -d= -f2 || echo "0.00")
          QUALIFIED=$(grep "^QUALIFIED=" /tmp/revenue_out.txt | cut -d= -f2 || echo "0")
          echo "gross=$GROSS" >> $GITHUB_OUTPUT
          echo "retained=$RETAINED" >> $GITHUB_OUTPUT
          echo "qualified=$QUALIFIED" >> $GITHUB_OUTPUT
      - name: Upload revenue state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revenue-state-${{ env.RUN_ID }}
          path: revenue_loop_state.json
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────
  # 4. RHNS NETWORK HEALTH
  # ─────────────────────────────────────────────────────────
  network_health:
    name: 🌐 RHNS Network Health
    runs-on: ubuntu-latest
    needs: [discovery, revenue]
    if: |
      always() &&
      needs.dedup_gate.outputs.should_run == 'true'
    outputs:
      total_nodes: ${{ steps.snap.outputs.total_nodes }}
      health: ${{ steps.snap.outputs.health }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install --quiet fastapi uvicorn pydantic
      - name: Network snapshot
        id: snap
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          python -c "
import asyncio, sys

try:
    from core.rhns_engine import RHNSEngine, NetworkNode, NodeTier, NodeState
    from core.apex_orchestrator import DOMAINS
    engine = RHNSEngine()
    async def run():
        apex = NetworkNode(name='apex', tier=NodeTier.APEX, domain='system',
                           capabilities=['orchestrate'])
        await engine.register(apex)
        for d in DOMAINS:
            node = NetworkNode(name=d['name'], tier=NodeTier.DOMAIN,
                               domain=d['name'], capabilities=d['capabilities'],
                               state=NodeState.ACTIVE)
            await engine.register(node)
        snapshot = await engine.discover()
        print(f\"Nodes: {snapshot['total_nodes']}\")
        print(f\"Active: {snapshot['active_nodes']}\")
        print(f\"Health: {snapshot['network_health']}\")
        return snapshot
    s = asyncio.run(run())
    print(f'NODES={s[\"total_nodes\"]}')
    print(f'HEALTH={s[\"network_health\"]}')
except Exception as e:
    print(f'RHNS module not loaded: {e}')
    print('NODES=0')
    print('HEALTH=unknown')
" | tee /tmp/health_out.txt
          NODES=$(grep "^NODES=" /tmp/health_out.txt | cut -d= -f2 || echo "0")
          HEALTH=$(grep "^HEALTH=" /tmp/health_out.txt | cut -d= -f2 || echo "unknown")
          echo "total_nodes=$NODES" >> $GITHUB_OUTPUT
          echo "health=$HEALTH" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────
  # 5. NWU TOKEN AUDIT
  # ─────────────────────────────────────────────────────────
  nwu_audit:
    name: 🪙 NWU Token Audit
    runs-on: ubuntu-latest
    needs: revenue
    if: |
      always() &&
      needs.dedup_gate.outputs.should_run == 'true'
    outputs:
      minted: ${{ steps.audit.outputs.minted }}
      settled_usd: ${{ steps.audit.outputs.settled_usd }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: NWU portfolio report
        id: audit
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          python -c "
try:
    from core.nwu_protocol import NWUProtocol
    nwu = NWUProtocol()
    for i in range(10):
        t = nwu.mint('ci-node', 'lead' if i % 2 == 0 else 'metric',
                     {'email': f'x{i}@garcar.io', 'value': i * 10})
        nwu.record_usage(t.token_id, 'ci-consumer', revenue_delta=float(i * 5))
    nwu.settle_all()
    p = nwu.portfolio()
    print(f\"Minted: {p['total_minted']}\")
    print(f\"Settled USD: \${p['total_settled_usd']:.4f}\")
    print(f\"Unrealized: \${p['unrealized_value']:.4f}\")
    print(f'MINTED={p[\"total_minted\"]}')
    print(f'SETTLED={p[\"total_settled_usd\"]:.4f}')
except Exception as e:
    print(f'NWU module not loaded: {e}')
    print('MINTED=0')
    print('SETTLED=0.0000')
" | tee /tmp/nwu_out.txt
          MINTED=$(grep "^MINTED=" /tmp/nwu_out.txt | cut -d= -f2 || echo "0")
          SETTLED=$(grep "^SETTLED=" /tmp/nwu_out.txt | cut -d= -f2 || echo "0.0000")
          echo "minted=$MINTED" >> $GITHUB_OUTPUT
          echo "settled_usd=$SETTLED" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────
  # 6. FAILURE ALERT — fires only when critical jobs fail
  # ─────────────────────────────────────────────────────────
  failure_alert:
    name: 🚨 Failure Alert
    runs-on: ubuntu-latest
    needs: [test, discovery, revenue, network_health, nwu_audit]
    if: |
      always() &&
      (needs.test.result == 'failure' ||
       needs.revenue.result == 'failure' ||
       needs.network_health.result == 'failure')
    steps:
      - name: Build failure report
        run: |
          echo "══════════════════════════════════════════"
          echo "  🚨 GARCAR SYSTEM FAILURE DETECTED"
          echo "  Run #${{ env.RUN_ID }} | ${{ env.TRIGGER }}"
          echo "══════════════════════════════════════════"
          echo "Test:           ${{ needs.test.result }}"
          echo "Discovery:      ${{ needs.discovery.result }}"
          echo "Revenue:        ${{ needs.revenue.result }}"
          echo "Network Health: ${{ needs.network_health.result }}"
          echo "NWU Audit:      ${{ needs.nwu_audit.result }}"
          echo "SHA: ${{ github.sha }}"
          echo "Repo: ${{ github.repository }}"
          echo "Actions URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "══════════════════════════════════════════"
          # Exit 1 to mark this job failed and make it visible in the dashboard
          exit 1

  # ─────────────────────────────────────────────────────────
  # 7. SYSTEM SUMMARY REPORT — always runs last
  # ─────────────────────────────────────────────────────────
  summary:
    name: 📊 System Summary
    runs-on: ubuntu-latest
    needs: [test, discovery, revenue, network_health, nwu_audit]
    if: always()
    steps:
      - name: Print full system report
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║      GARCAR AUTONOMOUS SYSTEM REPORT         ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "  Run:          #${{ env.RUN_ID }}"
          echo "  Trigger:      ${{ env.TRIGGER }}"
          echo "  Commit:       ${{ github.sha }}"
          echo "  Mode:         ${{ github.event.inputs.mode || 'full' }}"
          echo "╠══════════════════════════════════════════════╣"
          echo "  JOB RESULTS"
          echo "  ─────────────────────────────────────────────"
          echo "  🧪 Test Suite:      ${{ needs.test.result }}"
          echo "  🔬 Discovery:       ${{ needs.discovery.result }}"
          echo "  💰 Revenue:         ${{ needs.revenue.result }}"
          echo "  🌐 Network Health:  ${{ needs.network_health.result }}"
          echo "  🪙 NWU Audit:       ${{ needs.nwu_audit.result }}"
          echo "╠══════════════════════════════════════════════╣"
          echo "  METRICS"
          echo "  ─────────────────────────────────────────────"
          echo "  Capabilities:   ${{ needs.discovery.outputs.capabilities || 'N/A' }}"
          echo "  Breakthroughs:  ${{ needs.discovery.outputs.breakthroughs || 'N/A' }}"
          echo "  Leads Qualified: ${{ needs.revenue.outputs.qualified || 'N/A' }}"
          echo "  Gross Revenue:  \$${{ needs.revenue.outputs.gross || '0.00' }}"
          echo "  Net Retained:   \$${{ needs.revenue.outputs.retained || '0.00' }}"
          echo "  RHNS Nodes:     ${{ needs.network_health.outputs.total_nodes || 'N/A' }}"
          echo "  Network Health: ${{ needs.network_health.outputs.health || 'N/A' }}"
          echo "  NWU Minted:     ${{ needs.nwu_audit.outputs.minted || 'N/A' }}"
          echo "  NWU Settled:    \$${{ needs.nwu_audit.outputs.settled_usd || '0.0000' }}"
          echo "╠══════════════════════════════════════════════╣"
          echo "  🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "╚══════════════════════════════════════════════╝"

          # Set overall exit code based on critical job results
          TEST="${{ needs.test.result }}"
          REVENUE="${{ needs.revenue.result }}"
          HEALTH="${{ needs.network_health.result }}"

          if [[ "$TEST" == "failure" || "$REVENUE" == "failure" ]]; then
            echo "❌ CRITICAL FAILURE — system needs attention"
            exit 1
          elif [[ "$HEALTH" == "failure" ]]; then
            echo "⚠️  Network health degraded — monitoring required"
            exit 0
          else
            echo "✅ ALL SYSTEMS NOMINAL"
            exit 0
          fi
