name: 🤖 GARCAR HANDS-FREE MASTER v2 — Zero Touch Revenue

on:
  schedule:
    - cron: '0 */2 * * *'   # Every 2 hours
    - cron: '0 14 * * *'    # Daily 9AM CDT (14:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'full | revenue | deploy | sync'
        default: 'full'
        required: false

jobs:
  run-all:
    name: 💰 Fire All Revenue Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GH CLI Auth
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 🔑 Garcar Zero-Key Master
        run: gh workflow run garcar-zero-key.yml
        continue-on-error: true

      - name: Wait 10s
        run: sleep 10

      - name: 🔐 Secrets Bootstrap
        run: gh workflow run secrets-bootstrap.yml
        continue-on-error: true

      - name: ⚙️ Auto-Provision Secrets
        run: gh workflow run auto-provision-secrets.yml
        continue-on-error: true

      - name: 🔄 Auto-Rotate Keys
        run: gh workflow run auto-rotate-keys.yml
        continue-on-error: true

      - name: ☁️ Bootstrap AWS Keys
        run: gh workflow run bootstrap-aws-keys.yml
        continue-on-error: true

      - name: 🛡️ Zero-Touch Secrets
        run: gh workflow run zero-touch-secrets.yml
        continue-on-error: true

      - name: 🔍 Secrets Audit
        run: gh workflow run secrets-audit.yml
        continue-on-error: true

      - name: Wait 15s (let infra settle)
        run: sleep 15

      - name: 🏗️ Full Deploy
        run: gh workflow run deploy.yml
        continue-on-error: true

      - name: 📧 SES Recheck
        run: gh workflow run ses-recheck.yml
        continue-on-error: true

      - name: Wait 15s
        run: sleep 15

      - name: 💰 Master Revenue Trigger
        run: gh workflow run master-revenue-trigger.yml
        continue-on-error: true

      - name: 🚀 Revenue Bootstrap
        run: gh workflow run revenue-bootstrap.yml
        continue-on-error: true

      - name: 🎯 Customer Acquisition Loop
        run: gh workflow run customer-acquisition-loop.yml
        continue-on-error: true

      - name: 📊 ALW Allocator
        run: gh workflow run alw-allocator.yml
        continue-on-error: true

      - name: Wait 15s
        run: sleep 15

      - name: 🧠 Master Orchestrator
        run: gh workflow run master-orchestrator.yml
        continue-on-error: true

      - name: 📱 Phone Trigger
        run: gh workflow run phone-trigger.yml
        continue-on-error: true

      - name: 🤝 Auto-Merge Copilot PRs
        run: gh workflow run auto-merge-copilot.yml
        continue-on-error: true

      - name: 📊 Final Revenue Status
        run: |
          echo "══════════════════════════════════════"
          echo "  🤖 GARCAR REVENUE MACHINE FIRED"
          echo "══════════════════════════════════════"
          echo "  All 17 workflows triggered"
          echo "  Time: $(date)"
          echo "  Next auto-run: in 2 hours"
          echo "══════════════════════════════════════"
          echo "  Actions: https://github.com/Garrettc123/garcar-autonomous-wealth-system/actions"
          echo "  Stripe:  https://dashboard.stripe.com/payments"
          echo "══════════════════════════════════════"
          gh run list --limit 20
