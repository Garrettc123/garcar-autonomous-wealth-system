name: "\U0001F3AF Customer Acquisition Loop"
# Reusable workflow (workflow_call) AND standalone (workflow_dispatch).
# Called by master-revenue-trigger at Stage 4 with injected inputs.

on:
  workflow_call:
    inputs:
      leads_per_cycle:
        description: 'Leads per cycle'
        type: string
        required: false
        default: '50'
      dry_run:
        description: 'Dry run'
        type: string
        required: false
        default: 'false'
      niche_query:
        description: 'Niche override'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      leads_per_cycle:
        description: 'Leads per cycle'
        required: false
        default: '50'
      dry_run:
        required: false
        default: 'false'
      niche_query:
        required: false
        default: ''

permissions:
  contents: write

jobs:
  acquisition:
    name: Run Acquisition Loop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt -q

      - name: Check secrets
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APOLLO_KEY: ${{ secrets.APOLLO_API_KEY }}
          SES_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          UPGRADE_URL: ${{ secrets.UPGRADE_URL }}
        run: |
          if [ -z "$AWS_KEY" ] || [ -z "$AWS_SECRET" ]; then
            echo "⚠️ AWS credentials not configured — skipping"
            exit 0
          fi
          if [ -z "$APOLLO_KEY" ]; then
            echo "⚠️ APOLLO_API_KEY not configured — skipping"
            exit 0
          fi
          if [ -z "$SES_EMAIL" ]; then
            echo "⚠️ SES_SENDER_EMAIL not configured — skipping"
            exit 0
          fi
          if [ -z "$DASHBOARD_URL" ] || [ -z "$UPGRADE_URL" ]; then
            echo "⚠️ DASHBOARD_URL and UPGRADE_URL are required — skipping"
            exit 0
          fi

      - name: AWS Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Run Acquisition Loop
        env:
          APOLLO_API_KEY:            ${{ secrets.APOLLO_API_KEY }}
          AWS_REGION:                ${{ secrets.AWS_REGION || 'us-east-1' }}
          SES_SENDER_EMAIL:          ${{ secrets.SES_SENDER_EMAIL }}
          DASHBOARD_URL:             ${{ secrets.DASHBOARD_URL }}
          UPGRADE_URL:               ${{ secrets.UPGRADE_URL }}
          LEADS_PER_CYCLE:           ${{ inputs.leads_per_cycle || '50' }}
          MIN_LEAD_SCORE:            '60'
          REVENUE_PER_CLOSE:         '497'
          ESTIMATED_CONVERSION_RATE: '0.05'
          ACQ_LEDGER_PATH:           acquisition_ledger.json
          ALW_LEDGER_PATH:           alw_ledger.json
          DRY_RUN:                   ${{ inputs.dry_run || 'false' }}
          S3_BUCKET:                 ${{ secrets.S3_BUCKET || 'garcar-revenue-data' }}
        run: |
          NICHE="${{ inputs.niche_query }}"
          if [ -z "$NICHE" ]; then
            python customer_acquisition_loop.py
          else
            python customer_acquisition_loop.py "$NICHE"
          fi

      - name: Commit ledgers
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "acq cycle -- $(date -u '+%Y-%m-%d %H:%M UTC')"
          file_pattern: acquisition_ledger.json alw_ledger.json
          commit_user_name: garcar-acq-bot
          commit_user_email: actions@garcar.io
