name: 🐕 GARCAR Watchdog — Pipeline Health Monitor

on:
  schedule:
    - cron: '30 */4 * * *'   # Every 4 hours, offset from master
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    name: 🔍 Check Pipeline Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GH CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Check Last Master Run
        uses: actions/github-script@v7
        with:
          script: |
            // Get recent runs of the master workflow
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'garcar-hands-free-master.yml',
              per_page: 5
            });

            if (runs.data.workflow_runs.length === 0) {
              console.log('⚠️ No master pipeline runs found!');
              return;
            }

            const lastRun = runs.data.workflow_runs[0];
            const lastRunTime = new Date(lastRun.created_at);
            const now = new Date();
            const hoursAgo = (now - lastRunTime) / (1000 * 60 * 60);

            console.log(`Last run: ${lastRun.created_at}`);
            console.log(`Status: ${lastRun.conclusion || lastRun.status}`);
            console.log(`Hours ago: ${hoursAgo.toFixed(1)}`);

            // Alert if no run in 4+ hours (cron should fire every 2)
            if (hoursAgo > 4) {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'watchdog-alert'
              });

              const alertBody = [
                `## ⚠️ WATCHDOG ALERT — Pipeline Stalled`,
                ``,
                `The master pipeline has not run in **${hoursAgo.toFixed(1)} hours**.`,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Last Run** | ${lastRun.created_at} |`,
                `| **Last Status** | ${lastRun.conclusion || lastRun.status} |`,
                `| **Run URL** | [View](${lastRun.html_url}) |`,
                ``,
                `## Immediate Actions`,
                `- [ ] Check GitHub Actions status`,
                `- [ ] Manually trigger master pipeline`,
                `- [ ] Investigate why cron stopped`,
                ``,
                `---`,
                `*Auto-generated by GARCAR Watchdog*`
              ].join('\n');

              if (issues.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues.data[0].number,
                  body: `Still stalled at ${new Date().toISOString()} — last run was ${hoursAgo.toFixed(1)} hours ago.`
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `⚠️ WATCHDOG: Pipeline Stalled ${hoursAgo.toFixed(0)}h`,
                  body: alertBody,
                  labels: ['watchdog-alert', 'auto-generated', 'incident']
                });
              }
              console.log('🚨 Watchdog alert created!');
            } else if (lastRun.conclusion === 'failure') {
              console.log('⚠️ Last run failed — incident issue should already exist.');
            } else {
              console.log('✅ Pipeline is healthy.');
            }
