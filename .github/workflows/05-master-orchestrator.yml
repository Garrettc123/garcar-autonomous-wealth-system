name: 🏛️ Garcar Master Orchestrator

on:
  schedule:
    - cron: '0 6 * * *'   # Daily 6AM CT — full system health
    - cron: '0 20 * * *'  # Daily 8PM CT — revenue report
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: health | revenue | full'
        required: true
        default: 'full'

env:
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  REDIS_URL: ${{ secrets.REDIS_URL }}

jobs:
  # ── SYSTEM HEALTH CHECK ───────────────────────────────────────────
  system-health:
    name: 🩺 Full System Health Check
    runs-on: ubuntu-latest
    outputs:
      health_score: ${{ steps.health.outputs.score }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests stripe
      - id: health
        name: Run Health Monitor
        run: |
          python - <<'EOF'
          import os, requests, json
          from datetime import datetime

          checks = {}

          # Stripe
          try:
              import stripe
              stripe.api_key = os.environ.get('STRIPE_SECRET_KEY', '')
              stripe.Account.retrieve()
              checks['stripe'] = '✅ LIVE'
          except:
              checks['stripe'] = '❌ DOWN'

          # Linear
          try:
              r = requests.post(
                  'https://api.linear.app/graphql',
                  json={'query': '{ viewer { id name } }'},
                  headers={'Authorization': os.environ.get('LINEAR_API_KEY', '')},
                  timeout=5
              )
              checks['linear'] = '✅ LIVE' if r.status_code == 200 else f'❌ {r.status_code}'
          except:
              checks['linear'] = '❌ DOWN'

          # Notion
          try:
              r = requests.get(
                  'https://api.notion.com/v1/users/me',
                  headers={'Authorization': f'Bearer {os.environ.get("NOTION_TOKEN", "")}',
                           'Notion-Version': '2022-06-28'},
                  timeout=5
              )
              checks['notion'] = '✅ LIVE' if r.status_code == 200 else f'❌ {r.status_code}'
          except:
              checks['notion'] = '❌ DOWN'

          score = sum(1 for v in checks.values() if '✅' in v)
          total = len(checks)

          print('\n=== GARCAR ENTERPRISE — SYSTEM HEALTH ===')
          print(f'Timestamp: {datetime.utcnow().isoformat()}')
          for k, v in checks.items():
              print(f'  {k:20s}: {v}')
          print(f'\nHealth Score: {score}/{total}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'score={score}\n')
          EOF
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

  # ── DAILY REVENUE REPORT ──────────────────────────────────────────
  revenue-report:
    name: 📈 Daily Revenue Report → Notion
    runs-on: ubuntu-latest
    needs: system-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install stripe requests
      - name: Generate & Post Revenue Report
        run: |
          python - <<'EOF'
          import stripe, os, requests, json
          from datetime import datetime, timezone, timedelta

          stripe.api_key = os.environ.get('STRIPE_SECRET_KEY', '')

          today_start = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0).timestamp()

          try:
              charges = stripe.Charge.list(created={'gte': int(today_start)}, limit=100)
              daily_total = sum(c.amount for c in charges.auto_paging_iter() if c.status == 'succeeded') / 100
              charge_count = charges.total_count if hasattr(charges, 'total_count') else '?'
          except Exception as e:
              daily_total = 0
              charge_count = 0
              print(f'Stripe error: {e}')

          mtd_start = datetime.now(timezone.utc).replace(day=1, hour=0, minute=0, second=0).timestamp()
          try:
              mtd_charges = stripe.Charge.list(created={'gte': int(mtd_start)}, limit=100)
              mtd_total = sum(c.amount for c in mtd_charges.auto_paging_iter() if c.status == 'succeeded') / 100
          except:
              mtd_total = 0

          report = {
              'date': datetime.now(timezone.utc).strftime('%Y-%m-%d'),
              'daily_revenue': daily_total,
              'mtd_revenue': mtd_total,
              'transactions': charge_count,
              'goal_progress': f"{(mtd_total / 10000) * 100:.1f}% of $10K May gate"
          }

          print(json.dumps(report, indent=2))
          print(f"\n💰 Daily: ${daily_total:.2f} | MTD: ${mtd_total:.2f} | Goal: {report['goal_progress']}")

          # Post to Notion
          NOTION_TOKEN = os.environ.get('NOTION_TOKEN', '')
          if NOTION_TOKEN:
              page = {
                  'parent': {'type': 'workspace'},
                  'properties': {
                      'title': [{'text': {'content': f"Revenue Report — {report['date']} — ${daily_total:.2f} Today"}}]
                  },
                  'children': [{
                      'object': 'block', 'type': 'paragraph',
                      'paragraph': {'rich_text': [{'text': {'content': json.dumps(report, indent=2)}}]}
                  }]
              }
              r = requests.post(
                  'https://api.notion.com/v1/pages',
                  headers={'Authorization': f'Bearer {NOTION_TOKEN}', 'Notion-Version': '2022-06-28', 'Content-Type': 'application/json'},
                  json=page
              )
              print(f'Notion post: {r.status_code}')
          EOF
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

  # ── AUTONOMOUS ORCHESTRATOR CORE ──────────────────────────────────
  orchestrator:
    name: 🤖 Run Autonomous Orchestrator
    runs-on: ubuntu-latest
    needs: [system-health, revenue-report]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run Master Orchestrator
        run: python orchestrator_master.py
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        timeout-minutes: 15

  # ── TRIGGER DOWNSTREAM WORKFLOWS ─────────────────────────────────
  trigger-revenue-engine:
    name: ⚡ Trigger Revenue Intelligence Engine
    runs-on: ubuntu-latest
    needs: orchestrator
    steps:
      - name: Dispatch to revenue-intelligence-engine
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Garrettc123',
              repo: 'revenue-intelligence-engine',
              workflow_id: 'main.yml',
              ref: 'main',
              inputs: { triggered_by: 'garcar-master-orchestrator' }
            });
            console.log('✅ revenue-intelligence-engine triggered');
