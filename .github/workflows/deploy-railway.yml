name: Deploy to Railway

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up

      - name: Health check
        env:
          RAILWAY_APP_URL: ${{ secrets.RAILWAY_APP_URL }}
        run: |
          APP_URL="${RAILWAY_APP_URL:-https://your-app.up.railway.app}"
          for i in 1 2 3 4 5; do
            if curl -sf "${APP_URL}/health"; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Update Notion deployment status
        if: success()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DEPLOY_DB_ID: ${{ secrets.NOTION_DEPLOY_DB_ID }}
        run: |
          python scripts/notion_update_deploy.py live

      - name: Open P0 + rollback on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          python scripts/open_p0_issue.py "Deploy failed on main"
          railway rollback
