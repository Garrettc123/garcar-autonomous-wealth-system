name: 🔍 Secrets Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'secrets_manager.py'
      - '.env.example'

jobs:
  audit-secrets:
    name: Audit All Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Check AWS secrets
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "⚠️ AWS_ACCESS_KEY_ID not configured — skipping"
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: Run secrets audit
        env:
          APOLLO_API_KEY:    ${{ secrets.APOLLO_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SES_SENDER_EMAIL:  ${{ secrets.SES_SENDER_EMAIL }}
          LINEAR_API_KEY:    ${{ secrets.LINEAR_API_KEY }}
          AWS_REGION:        ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: python secrets_manager.py

      - name: Validate required secrets present
        env:
          APOLLO_API_KEY:    ${{ secrets.APOLLO_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SES_SENDER_EMAIL:  ${{ secrets.SES_SENDER_EMAIL }}
          AWS_REGION:        ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          python3 << 'PYEOF'
          import os, sys
          REQUIRED = ['STRIPE_SECRET_KEY', 'APOLLO_API_KEY', 'OPENAI_API_KEY', 'SES_SENDER_EMAIL', 'AWS_REGION']
          missing = [k for k in REQUIRED if not os.environ.get(k)]
          if missing:
              print(f'MISSING REQUIRED SECRETS: {missing}')
              print('Add these in: GitHub repo -> Settings -> Secrets -> Actions')
              print('Workflow will continue but some features may be degraded.')
          else:
              print(f'All {len(REQUIRED)} required secrets present.')
          PYEOF
