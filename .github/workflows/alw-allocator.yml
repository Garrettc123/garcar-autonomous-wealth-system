name: 💸 ALW Wealth Allocator
# Reusable (workflow_call) + standalone (workflow_dispatch + schedule)

on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '0 14 * * 5'  # Fridays 9 AM CDT

permissions:
  contents: write

jobs:
  allocate:
    name: ALW Allocation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install boto3 requests stripe -q

      - name: AWS Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true

      - name: Run ALW Allocator
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AWS_REGION:        ${{ secrets.AWS_REGION || 'us-east-1' }}
          ALW_LEDGER_PATH:   alw_ledger.json
          S3_BUCKET:         ${{ secrets.S3_BUCKET || 'garcar-revenue-data' }}
        run: python abundance_wallet.py

      - name: Commit ALW ledger
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "alw allocation -- $(date -u '+%Y-%m-%d %H:%M UTC')"
          file_pattern: alw_ledger.json
          commit_user_name: garcar-alw-bot
          commit_user_email: actions@garcar.io
